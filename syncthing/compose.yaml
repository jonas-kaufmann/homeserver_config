services:
  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    hostname: sagittarius0-syncthing
    volumes:
      - /mnt/media0/syncthing:/var/syncthing
      - /backup:/var/syncthing/data/backup
    environment:
      - PUID=1000
      - PGID=1000
    ports:
    - 8384:8384
    - 22000:22000/tcp
    - 22000:22000/udp
    - 21027:21027/udp
    restart: unless-stopped
